<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Certificate generator — KERVIII (owner tool)</title>
<link rel="stylesheet" href="../css/themes.css">
<style>
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,sans-serif;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  main{max-width:960px;margin:0 auto;display:grid;gap:20px}
  h1{font-size:1.4rem;margin:0}
  p.note{color:var(--text-2);margin:0;font-size:.9rem}
  form{display:grid;gap:12px;padding:20px;border:1px solid var(--border);border-radius:16px;background:var(--surface)}
  label{font:500 .8rem/1 ui-monospace,monospace;color:var(--text-2)}
  input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:16px;margin-top:6px}
  .row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .approve{display:flex;gap:10px;align-items:flex-start;font:400 .9rem/1.5 system-ui,sans-serif;color:var(--text)}
  .approve input{width:auto;margin:4px 0 0}
  button{min-height:48px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:1rem;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .err{color:var(--err);font-size:.88rem;min-height:1.2em;margin:0}
  canvas{width:100%;height:auto;border:1px solid var(--border);border-radius:12px;background:#fff}
</style>
</head>
<body>
<main>
  <h1>Project completion certificate</h1>
  <p class="note">Owner tool. Not linked from the public site. Issue a certificate only after you have approved the project as complete. It states that it is not an accreditation or third-party certification.</p>
  <form id="f" novalidate>
    <div class="row">
      <div><label for="r">Recipient name</label><input id="r" maxlength="60" autocomplete="off"></div>
      <div><label for="d">Completion date</label><input id="d" type="date"></div>
    </div>
    <div><label for="t">Project or service title</label><input id="t" maxlength="120" autocomplete="off"></div>
    <div class="row">
      <div><label for="n">Reference number</label><input id="n" placeholder="KV-YYYYMMDD-001" autocomplete="off"></div>
    </div>
    <label class="approve"><input type="checkbox" id="ok"><span>I approve issuing this certificate for the completed project above.</span></label>
    <p class="err" id="err" role="alert"></p>
    <button type="submit" id="go" disabled>Generate preview</button>
  </form>
  <canvas id="c" width="1600" height="1130" aria-label="Certificate preview" hidden></canvas>
  <button type="button" id="dl" hidden>Download PNG</button>
</main>
<script src="../js/certgen.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)},g=KP.certgen;
  try{if(matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.setAttribute("data-theme","light")}catch(e){}
  $("ok").addEventListener("change",function(){$("go").disabled=!$("ok").checked});
  $("d").addEventListener("change",function(){if($("d").value&&!$("n").value)$("n").value=g.refNumber($("d").value+"T00:00:00",1)});
  $("f").addEventListener("submit",function(e){
    e.preventDefault();
    var v={recipient:$("r").value,title:$("t").value,date:$("d").value,ref:$("n").value.trim()};
    var errs=g.validate(v);$("err").textContent=errs.join(" ");
    if(errs.length||!$("ok").checked)return;
    g.draw($("c"),v);$("c").hidden=false;$("dl").hidden=false;
  });
  $("dl").addEventListener("click",function(){
    $("c").toBlob(function(b){
      var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="kerviii-certificate-"+$("n").value.trim()+".png";
      document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
    },"image/png");
  });
})();
</script>
</body>
</html>
